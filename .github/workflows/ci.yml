name: CI

# Runs the test suites and typecheck on every PR.
#
# Path filtering happens at the JOB level, not the workflow level. A workflow
# skipped by `paths:` never creates its check runs, which leaves required
# checks "Pending" forever and blocks the merge. A job skipped by an `if:`
# condition reports "skipped", which GitHub counts as passing ("success,
# skipped, and neutral" all satisfy a required check). See
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
#
# So: every job here is safe to mark as a required check.
#
# Lint is deliberately absent — apps/web has pre-existing eslint errors. Add
# `pnpm --filter web lint` to web-tests once those are fixed.

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo the PR touches. On pull_request events
  # paths-filter reads the changed-file list from the API — no checkout needed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # These filters encode the workspace dependency graph by hand:
          # @troptix/api depends on @troptix/db and the live schema (supabase/),
          # web depends on every package. Root manifest/lockfile or workflow
          # changes rerun everything.
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/db/**'
              - 'supabase/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'e2e/**'
              - 'supabase/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  # Always runs, unfiltered: its job is catching cross-workspace breakage
  # (a type change in @troptix/db breaking apps/web), which path filters
  # cannot predict.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces
        run: pnpm typecheck

  web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web unit tests
        run: pnpm --filter web test

  # The @troptix/api suite is integration tests against a real Postgres.
  # `supabase db start` boots the local database container and applies every
  # migration in supabase/migrations plus supabase/seed.sql — the same engine
  # local dev uses. The local container has no SSL, hence sslmode=disable
  # (honored by packages/db/src/index.ts).
  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: the action's default lags far behind. Keep roughly in step
          # with the CLI version used for local dev.
          version: 2.110.0
      - name: Start local Postgres (migrations + seed)
        run: supabase db start
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run API integration tests
        run: pnpm --filter @troptix/api test

  # Browser tests for the buyer flow (e2e/). Hermetic: the same local Postgres
  # the api-tests use, a production build of apps/web, real Stripe test mode.
  # No webhook forwarding is needed — the checkout page's own poll fulfils the
  # order (ADR 0029). Every test is recorded; the HTML report and the stitched
  # proof video are uploaded as the run's artifact. Paid specs skip themselves
  # when the Stripe test keys are not configured as repo secrets.
  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      CI: 1
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Start local Postgres (migrations + seed)
        run: supabase db start
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @troptix/e2e exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter @troptix/e2e build:web
      - name: Run browser tests
        run: pnpm --filter @troptix/e2e test
      - name: Stitch proof video
        if: always()
        run: pnpm --filter @troptix/e2e proof
      - name: Upload report and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 30

  # Supabase Branching's merge-time `supabase db push` (no --include-all) only
  # applies migrations whose filenames sort above the newest already-applied
  # one, so a migration that sorts at or below main's head is silently skipped
  # on merge. This bit twice (e7dc6b76, #505). `pnpm db:new` stamps new files
  # correctly; this catches hand-named files and branches that went stale
  # after generation. Always runs — it's seconds, and needs no path filter.
  migration-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check new migrations sort above main's head
        run: |
          set -euo pipefail
          export LC_ALL=C
          git fetch --quiet --depth=1 origin main
          list() { git ls-tree -r --name-only "$1" -- supabase/migrations | sort; }
          # Compare what `supabase db push` compares: the digit version prefix
          # of <version>_<name>.sql files. Full-path comparison would pass a
          # file whose version ties main's head, and a stray non-migration
          # file on main would poison the baseline.
          pattern='^supabase/migrations/[0-9]+_[^/]+\.sql$'
          main_head=$(list origin/main | grep -E "$pattern" | tail -n1 || true)
          main_version=${main_head##*/}; main_version=${main_version%%_*}
          new_files=$(comm -13 <(list origin/main) <(list HEAD))
          if [ -z "$new_files" ]; then
            echo "No new migrations in this PR."
            exit 0
          fi
          bad=0
          while IFS= read -r f; do
            if [[ ! "$f" =~ $pattern ]]; then
              echo "FAIL: $f does not match <version>_<name>.sql — 'supabase db push' would never apply it"
              bad=1
              continue
            fi
            version=${f##*/}; version=${version%%_*}
            if [[ "$version" > "$main_version" ]]; then
              echo "ok: $f"
            else
              echo "FAIL: $f (version $version) sorts at or below main's newest migration ($main_head)"
              bad=1
            fi
          done <<< "$new_files"
          if [ "$bad" -eq 1 ]; then
            echo
            echo "Merge-time 'supabase db push' silently skips migrations that do not"
            echo "sort above the newest applied filename. Rename the file with a newer"
            echo "timestamp ('pnpm db:new' stamps one correctly)."
            exit 1
          fi
